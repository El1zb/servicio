; php artisan serve corre bajo el SAPI "cli" — ahí opcache.enable_cli viene
; "Off" de fábrica en la imagen php:8.3-cli, así que CADA petición
; recompilaba Laravel + todo vendor/ desde cero (ver docker/entrypoint.sh).
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; La imagen es inmutable por deploy (el código no cambia sin rebuild) —
; sin esto, opcache igual hace un stat() por archivo en cada petición para
; revisar si cambió.
opcache.validate_timestamps=0
